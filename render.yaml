# D3COY — Render Blueprint for the FREE tier (no credit card required).
#
# Two free services:
#   d3coy-gateway   (web, plan: free)  — FastAPI gateway + sandbox executor in ONE process
#   d3coy-frontend  (static site)      — React/Vite dashboard on Render's CDN (always on)
#
# The gateway runs on 512 MB, so it uses requirements-lite.txt (NO torch): the semantic layer
# runs in its lexical fallback mode. All four detection layers still work; scenarios, reviews,
# audit, WebSocket and the live Gemini agent all run. The trained behavioral baseline committed
# in d3coy-backend/artifacts/ is used directly (no slow auto-training on boot).
#
# TRADE-OFFS of the free tier (expected, not bugs):
#   • The gateway sleeps after ~15 min idle; the first click wakes it (~30–60 s cold start).
#   • Storage is ephemeral — the SQLite data resets on every deploy/restart (fine for a demo).
#   • The semantic detector is lexical (token overlap), not the transformer. (Upgrade path:
#     deploy render-paid.yaml on a 2 GB plan for the full transformer-based semantic layer.)
#
# DEPLOY: Render Dashboard → New → Blueprint → connect this repo. See DEPLOY-RENDER.md.

services:

  # ── Gateway (public web service, free) ──────────────────────────────────────
  - type: web
    name: d3coy-gateway
    runtime: python
    plan: free
    rootDir: d3coy-backend
    buildCommand: pip install -r requirements-lite.txt
    startCommand: bash start_render_free.sh
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO

      # Ephemeral SQLite (no persistent disk on free tier) — resets on restart.
      - key: DATABASE_URL
        value: sqlite:////tmp/d3coy.db
      - key: SANDBOX_DATABASE_URL
        value: sqlite:////tmp/sandbox.db

      # Use the committed baseline instead of training on boot (faster, less memory).
      - key: ARTIFACTS_DIR
        value: ./artifacts
      - key: AUTO_TRAIN_BASELINE
        value: "false"
      - key: SEED_ON_STARTUP
        value: "true"
      - key: AGENT_AUTH_REQUIRED
        value: "true"

      # Semantic layer WITHOUT torch: keep it enabled with the lexical fallback. Because
      # sentence-transformers is not installed, the deferred import fails and the validator
      # uses the lexical (token-overlap) backend — still reports OK, so fail-closed is not hit.
      - key: SEMANTIC_ENABLED
        value: "true"
      - key: SEMANTIC_FALLBACK
        value: "lexical"
      - key: SEMANTIC_ALLOW_DOWNLOAD
        value: "false"

      - key: AGENT_DEMO_ENABLED
        value: "true"
      - key: EXECUTOR_TIMEOUT_SECONDS
        value: "15"

      # Allow the deployed frontend's origin (Render injects its full https URL).
      - key: CORS_ORIGINS
        fromService:
          name: d3coy-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL

      # ── Secrets / generated ────────────────────────────────────────────────
      # Shared HMAC key for permission slips — Render generates one; both the gateway and the
      # internal executor read it from this same environment, so they always match.
      - key: PERMISSION_SIGNING_KEY
        generateValue: true
      # Leave BLANK in the dashboard for OPEN MODE (judges can run everything with no login).
      # Set a strong value to require the admin login instead.
      - key: ADMIN_API_KEY
        sync: false
      # Optional — paste your Google AI Studio key to enable the Live Agent Demo button.
      - key: GEMINI_API_KEY
        sync: false
      - key: D3COY_AGENT_PROVIDER
        value: gemini
      - key: D3COY_AGENT_MODEL
        value: gemini-3.8-flash

  # ── Frontend (static site, free, always on) ─────────────────────────────────
  - type: web
    name: d3coy-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Full https URL of the gateway, baked into the bundle at build time. The WebSocket URL
      # (wss://) is derived from it automatically by src/services/apiClient.js.
      - key: VITE_API_BASE_URL
        fromService:
          name: d3coy-gateway
          type: web
          envVarKey: RENDER_EXTERNAL_URL
